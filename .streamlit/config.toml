[theme]
base = "dark"
primaryColor = "#60a5fa"
backgroundColor = "#0b0f19"
secondaryBackgroundColor = "#111827"
textColor = "#e5e7eb"
font = "sans serif"

[server]
port = 8501
address = "0.0.0.0"
headless = true
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false
maxMessageSize = 200
enableStaticServing = false
disconnectedSessionTTL = 7200

[runner]
fastReruns = true

[browser]
gatherUsageStats = false
